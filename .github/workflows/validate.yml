name: Device Tree Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-device-tree:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Validate Required Directories
        run: |
          test -d device/oppo/OP4C7D || exit 1
          test -d device/oppo/OP4C7D/prebuilts || exit 1
          test -d device/oppo/OP4C7D/rootdir || exit 1

      - name: Validate Required Files
        run: |
          test -f device/oppo/OP4C7D/BoardConfig.mk || exit 1
          test -f device/oppo/OP4C7D/device.mk || exit 1
          test -f device/oppo/OP4C7D/lineage_OP4C7D.mk || exit 1
          test -f device/oppo/OP4C7D/AndroidProducts.mk || exit 1
          test -f device/oppo/OP4C7D/rootdir/etc/fstab.mt6765 || exit 1
          test -f device/oppo/OP4C7D/prebuilts/Image || exit 1
          test -f device/oppo/OP4C7D/prebuilts/dtbo.img || exit 1

      - name: Validate BoardConfig Variables
        run: |
          grep -q "TARGET_BOARD_PLATFORM := mt6765" device/oppo/OP4C7D/BoardConfig.mk || exit 1
          grep -q "TARGET_FORCE_PREBUILT_KERNEL := true" device/oppo/OP4C7D/BoardConfig.mk || exit 1
          grep -q "BOARD_KERNEL_IMAGE_NAME := Image" device/oppo/OP4C7D/BoardConfig.mk || exit 1
          grep -q "TARGET_PREBUILT_KERNEL := \$(DEVICE_PATH)/prebuilts/Image" device/oppo/OP4C7D/BoardConfig.mk || exit 1

      - name: Validate Product Definitions
        run: |
          grep -q "PRODUCT_NAME := lineage_OP4C7D" device/oppo/OP4C7D/lineage_OP4C7D.mk || exit 1
          grep -q "PRODUCT_DEVICE := OP4C7D" device/oppo/OP4C7D/lineage_OP4C7D.mk || exit 1
          grep -q "PRODUCT_MANUFACTURER := oppo" device/oppo/OP4C7D/lineage_OP4C7D.mk || exit 1

      - name: Validate Lunch Targets
        run: |
          grep -q "lineage_OP4C7D-user" device/oppo/OP4C7D/AndroidProducts.mk || exit 1
          grep -q "lineage_OP4C7D-userdebug" device/oppo/OP4C7D/AndroidProducts.mk || exit 1
          grep -q "lineage_OP4C7D-eng" device/oppo/OP4C7D/AndroidProducts.mk || exit 1

      - name: Validate Vendor Inheritance
        run: |
          grep -q "vendor/oppo/OP4C7D/OP4C7D-vendor.mk" device/oppo/OP4C7D/device.mk || exit 1

      - name: Validate Recovery Fstab
        run: |
          grep -q "/data" device/oppo/OP4C7D/rootdir/etc/fstab.mt6765 || exit 1
          grep -q "fileencryption=aes-256-xts" device/oppo/OP4C7D/rootdir/etc/fstab.mt6765 || exit 1

      - name: Validate Manifest Exists
        run: |
          test -f device/oppo/OP4C7D/manifest.xml || exit 1

      - name: Print Success
        run: |
          echo "Device tree validation passed successfully."
